<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sky북스 - 내 서재</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/50 text-stone-800 min-h-screen flex flex-col justify-between">

    <!-- 상단 네비게이션바 -->
    <header class="w-full bg-white border-b border-stone-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-4xl mx-auto p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-amber-900 flex items-center gap-2">
                📚 sky북스 <span class="text-xs font-normal bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">내 서재</span>
            </h1>
            <div class="flex items-center gap-4">
                <span class="text-xs text-stone-500 hidden sm:inline" id="user-email">yooneeeo@gmail.com 님</span>
                <button onclick="handleLogout()" class="text-xs font-medium text-stone-600 hover:text-stone-900 border border-stone-300 px-3 py-1.5 rounded-lg transition">로그아웃</button>
            </div>
        </div>
    </header>

    <!-- 메인 책꽂이 컨테이너 -->
    <main class="w-full max-w-4xl mx-auto px-6 py-8 flex-1">
        
        <!-- 상단 액션 바 -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-bold text-stone-900">나의 책꽂이</h2>
                <p class="text-xs text-stone-500 mt-0.5" id="book-count">서재를 불러오는 중...</p>
            </div>
            <button onclick="openUploadModal()" class="flex items-center gap-2 px-4 py-2 bg-amber-800 text-white text-sm font-semibold rounded-xl shadow hover:bg-amber-900 transition">
                <span>+ 새 책 추가하기</span>
            </button>
        </div>

        <!-- 책 그리드 목록 -->
        <div id="book-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            <!-- 책 목록이 동적으로 들어갑니다 -->
        </div>

    </main>

    <!-- 새 책 추가 모달 -->
    <div id="upload-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <h3 class="text-lg font-bold text-stone-900 mb-4">새 책 등록하기</h3>
            <form id="upload-form" onsubmit="uploadBook(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">책 제목</label>
                    <input type="text" id="book-title" required class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-800">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">저자</label>
                    <input type="text" id="book-author" required class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-800">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">책 표지 이미지</label>
                    <input type="file" id="book-image" accept="image/*" required class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm text-stone-500 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-100 file:text-amber-800 hover:file:bg-amber-200">
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeUploadModal()" class="px-4 py-2 text-sm text-stone-600 hover:bg-stone-100 rounded-xl transition">취소</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-amber-800 text-white font-semibold rounded-xl hover:bg-amber-900 transition">업로드</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 책 상세 내용 및 메모 추가 모달 -->
    <div id="detail-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
            <h3 id="detail-title" class="text-lg font-bold text-stone-900">책 상세 정보</h3>
            <p id="detail-author" class="text-xs text-stone-500"></p>
            <div>
                <label class="block text-xs font-medium text-stone-600 mb-1">나의 독서 메모 및 내용 추가</label>
                <textarea id="book-memo" rows="4" class="w-full border border-stone-300 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-800" placeholder="이 책에 대한 생각이나 메모를 남겨보세요..."></textarea>
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button type="button" onclick="closeDetailModal()" class="px-4 py-2 text-sm text-stone-600 hover:bg-stone-100 rounded-xl transition">닫기</button>
                <button type="button" onclick="saveBookMemo()" class="px-4 py-2 text-sm bg-amber-800 text-white font-semibold rounded-xl hover:bg-amber-900 transition">메모 저장</button>
            </div>
        </div>
    </div>

    <!-- 하단 푸터 -->
    <footer class="w-full max-w-4xl mx-auto p-6 text-center text-xs text-stone-400 border-t border-stone-200 mt-12 space-y-1">
        <p>&copy; sky북스. All rights reserved. by sungkook.yoon</p>
        <p>
            Contact: <a href="&#109;&#97;&#105;&#108;&#116;&#111;&#58;&#121;&#111;&#111;&#110;&#101;&#101;&#111;&#64;&#103;&#109;&#97;&#105;&#108;&#46;&#99;&#111;&#109;" class="no-underline hover:text-stone-600 transition">&#121;&#111;&#111;&#110;&#101;&#101;&#111;&#64;&#103;&#109;&#97;&#105;&#108;&#46;&#99;&#111;&#109;</a>
        </p>
    </footer>

    <!-- 자바스크립트 통신 로직 -->
    <script>
        const API_BASE = "https://skybooks-server.onrender.com";
        let currentSelectedBook = null;

        // 서재 상태 확인
        async function fetchBooks() {
            try {
                const response = await fetch(`${API_BASE}/`);
                const data = await response.json();
                document.getElementById('book-count').innerText = "서버 연결 성공!";
            } catch (error) {
                document.getElementById('book-count').innerText = "서버 연결 확인 필요";
            }
        }

        // 1. 로그아웃 기능
        function handleLogout() {
            if (confirm("로그아웃 하시겠습니까?")) {
                alert("성공적으로 로그아웃되었습니다.");
                // 화면 초기화 또는 로그인 상태 해제 연출
                document.getElementById('user-email').innerText = "손님 님";
                location.reload();
            }
        }

        // 모달 제어 함수들
        function openUploadModal() {
            document.getElementById('upload-modal').classList.remove('hidden');
            document.getElementById('upload-modal').classList.add('flex');
        }

        function closeUploadModal() {
            document.getElementById('upload-modal').classList.add('hidden');
            document.getElementById('upload-modal').classList.remove('flex');
        }

        function openDetailModal(title, author) {
            currentSelectedBook = title;
            document.getElementById('detail-title').innerText = title;
            document.getElementById('detail-author').innerText = `저자: ${author || '직접 업로드'}`;
            document.getElementById('book-memo').value = localStorage.getItem(`memo_${title}`) || "";
            
            document.getElementById('detail-modal').classList.remove('hidden');
            document.getElementById('detail-modal').classList.add('flex');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.add('hidden');
            document.getElementById('detail-modal').classList.remove('flex');
        }

        // 2. 책 내용/메모 저장 기능
        function saveBookMemo() {
            const memo = document.getElementById('book-memo').value;
            if (currentSelectedBook) {
                localStorage.setItem(`memo_${currentSelectedBook}`, memo);
                alert("메모가 성공적으로 저장되었습니다!");
                closeDetailModal();
            }
        }

        // 서버로 책 업로드
        async function uploadBook(event) {
            event.preventDefault();

            const title = document.getElementById('book-title').value;
            const author = document.getElementById('book-author').value;
            const imageFile = document.getElementById('book-image').files[0];

            const formData = new FormData();
            formData.append('title', title);
            formData.append('file', imageFile);

            try {
                const response = await fetch(`${API_BASE}/api/upload-page`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    alert(result.message || "책이 성공적으로 보정되었습니다!");
                    closeUploadModal();
                    
                    addBookCard(title, author, URL.createObjectURL(imageFile));
                    document.getElementById('upload-form').reset();
                } else {
                    alert("업로드 중 문제가 발생했습니다.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("서버와 통신하지 못했습니다.");
            }
        }

        // 화면에 책 카드 추가 (클릭 시 상세 모달 연동)
        function addBookCard(title, author, imgSrc) {
            const grid = document.getElementById('book-grid');
            const card = document.createElement('div');
            card.className = "bg-white p-3 rounded-2xl shadow-sm border border-stone-200 flex flex-col justify-between hover:shadow-md transition cursor-pointer group";
            card.onclick = () => openDetailModal(title, author);
            
            card.innerHTML = `
                <div class="bg-stone-100 aspect-[3/4] rounded-xl flex items-center justify-center text-stone-400 text-xs mb-3 group-hover:bg-amber-50 transition overflow-hidden">
                    <img src="${imgSrc}" alt="${title}" class="w-full h-full object-cover">
                </div>
                <div>
                    <h3 class="font-bold text-stone-800 text-sm truncate">${title}</h3>
                    <p class="text-xs text-stone-500 truncate mt-0.5">${author}</p>
                    <div class="mt-2 flex items-center justify-between text-[10px] text-stone-400 border-t border-stone-100 pt-2">
                        <span>방금 전</span>
                        <span class="text-amber-800 font-medium">상세보기</span>
                    </div>
                </div>
            `;
            grid.prepend(card);
        }

        fetchBooks();
    </script>
</body>
</html>
