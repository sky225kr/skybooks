<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sky북스 - 내 서재</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/50 text-stone-800 min-h-screen flex flex-col justify-between">

    <!-- 상단 네비게이션바 -->
    <header class="w-full bg-white border-b border-stone-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-4xl mx-auto p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-amber-900 flex items-center gap-2 cursor-pointer" onclick="checkLoginStatus()">
                📚 sky북스 <span class="text-xs font-normal bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">내 서재</span>
            </h1>
            <div class="flex items-center gap-3">
                <button id="admin-nav-btn" onclick="openAdminModal()" class="hidden text-xs font-medium bg-stone-800 text-white px-3 py-1.5 rounded-lg transition hover:bg-stone-900">운영자 패널</button>
                <button id="edit-info-btn" onclick="openEditModal()" class="hidden text-xs font-medium text-stone-700 border border-stone-300 px-3 py-1.5 rounded-lg transition hover:bg-stone-100">정보 수정</button>
                <span class="text-xs text-stone-500 hidden sm:inline" id="user-display"></span>
                <button id="auth-btn" onclick="handleLogout()" class="hidden text-xs font-medium text-stone-600 hover:text-stone-900 border border-stone-300 px-3 py-1.5 rounded-lg transition">로그아웃</button>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="w-full max-w-4xl mx-auto px-6 py-8 flex-1">
        
        <!-- 1. 로그인 뷰 -->
        <div id="login-view" class="flex flex-col items-center justify-center py-12 text-center">
            <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full space-y-4 border border-stone-200">
                <h3 class="text-xl font-bold text-stone-900">로그인</h3>
                <p class="text-xs text-stone-500">계정 정보를 입력해주세요.</p>
                <input type="email" id="login-email" placeholder="이메일" class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-800">
                <input type="password" id="login-password" placeholder="비밀번호" class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-800">
                <button onclick="performLogin()" class="w-full py-2 bg-amber-800 text-white text-sm font-semibold rounded-xl hover:bg-amber-900 transition">로그인</button>
                <div class="text-xs text-stone-400 pt-2 border-t border-stone-100 flex justify-between">
                    <span>계정이 없으신가요?</span>
                    <button onclick="switchView('signup')" class="text-amber-800 font-medium hover:underline">회원가입하기</button>
                </div>
            </div>
        </div>

        <!-- 2. 회원가입 뷰 -->
        <div id="signup-view" class="hidden flex flex-col items-center justify-center py-12 text-center">
            <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full space-y-4 border border-stone-200">
                <h3 class="text-xl font-bold text-stone-900">회원가입</h3>
                <p class="text-xs text-stone-500">새로운 sky북스 계정을 만드세요.</p>
                <input type="email" id="signup-email" placeholder="사용할 이메일" class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-800">
                <input type="password" id="signup-password" placeholder="비밀번호" class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-800">
                <input type="password" id="signup-password-confirm" placeholder="비밀번호 확인" class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-800">
                <button onclick="performSignup()" class="w-full py-2 bg-amber-800 text-white text-sm font-semibold rounded-xl hover:bg-amber-900 transition">가입 완료</button>
                <div class="text-xs text-stone-400 pt-2 border-t border-stone-100 flex justify-between">
                    <span>이미 계정이 있으신가요?</span>
                    <button onclick="switchView('login')" class="text-amber-800 font-medium hover:underline">로그인하기</button>
                </div>
            </div>
        </div>

        <!-- 3. 서재 뷰 (로그인 후) -->
        <div id="bookstore-view" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-stone-900">나의 책꽂이</h2>
                    <p class="text-xs text-stone-500 mt-0.5" id="book-count">서재를 불러오는 중...</p>
                </div>
                <button onclick="openUploadModal()" class="flex items-center gap-2 px-4 py-2 bg-amber-800 text-white text-sm font-semibold rounded-xl shadow hover:bg-amber-900 transition">
                    <span>+ 새 책 추가하기</span>
                </button>
            </div>

            <!-- 책 그리드 목록 -->
            <div id="book-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <!-- 동적 렌더링 -->
            </div>
        </div>

    </main>

    <!-- 정보 수정 모달 -->
    <div id="edit-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl space-y-4">
            <h3 class="text-lg font-bold text-stone-900">비밀번호 변경</h3>
            <div>
                <label class="block text-xs font-medium text-stone-600 mb-1">현재 비밀번호</label>
                <input type="password" id="current-password" class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-800">
            </div>
            <div>
                <label class="block text-xs font-medium text-stone-600 mb-1">새 비밀번호</label>
                <input type="password" id="new-password" class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-800">
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button type="button" onclick="closeEditModal()" class="px-4 py-2 text-sm text-stone-600 hover:bg-stone-100 rounded-xl transition">취소</button>
                <button type="button" onclick="updatePassword()" class="px-4 py-2 text-sm bg-amber-800 text-white font-semibold rounded-xl hover:bg-amber-900 transition">변경하기</button>
            </div>
        </div>
    </div>

    <!-- 운영자 패널 모달 -->
    <div id="admin-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-xl max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-lg font-bold text-stone-900">🛠️ 운영자 패널 (전체 회원 및 서재 현황)</h3>
                <button onclick="closeAdminModal()" class="text-stone-400 hover:text-stone-700 text-sm font-bold">✕</button>
            </div>
            <div id="admin-user-list" class="flex-1 overflow-y-auto space-y-4 pr-2">
                <!-- 운영자 데이터 동적 렌더링 -->
            </div>
        </div>
    </div>

    <!-- 새 책 추가 모달 -->
    <div id="upload-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <h3 class="text-lg font-bold text-stone-900 mb-4">새 책 등록하기</h3>
            <form id="upload-form" onsubmit="uploadBook(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">책 제목</label>
                    <input type="text" id="book-title" required class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-800">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">저자</label>
                    <input type="text" id="book-author" required class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-800">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">책 표지 이미지</label>
                    <input type="file" id="book-image" accept="image/*" required class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm text-stone-500 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-100 file:text-amber-800 hover:file:bg-amber-200">
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeUploadModal()" class="px-4 py-2 text-sm text-stone-600 hover:bg-stone-100 rounded-xl transition">취소</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-amber-800 text-white font-semibold rounded-xl hover:bg-amber-900 transition">업로드</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 푸터 -->
    <footer class="w-full max-w-4xl mx-auto p-6 text-center text-xs text-stone-400 border-t border-stone-200 mt-12 space-y-1">
        <p>&copy; sky북스. All rights reserved. by sungkook.yoon</p>
    </footer>

    <!-- 자바스크립트 로직 -->
    <script>
        const API_BASE = "https://skybooks-server.onrender.com";

        window.onload = function() {
            checkLoginStatus();
        };

        function switchView(viewName) {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('signup-view').classList.add('hidden');
            document.getElementById('bookstore-view').classList.add('hidden');

            if (viewName === 'login') {
                document.getElementById('login-view').classList.remove('hidden');
            } else if (viewName === 'signup') {
                document.getElementById('signup-view').classList.remove('hidden');
            } else if (viewName === 'bookstore') {
                document.getElementById('bookstore-view').classList.remove('hidden');
            }
        }

        function checkLoginStatus() {
            const currentUser = localStorage.getItem("skybooks_logged_in_user");
            const isAdmin = localStorage.getItem("skybooks_is_admin") === "true";
            
            const userDisplay = document.getElementById('user-display');
            const authBtn = document.getElementById('auth-btn');
            const adminNavBtn = document.getElementById('admin-nav-btn');
            const editInfoBtn = document.getElementById('edit-info-btn');

            if (currentUser) {
                userDisplay.innerText = currentUser + " 님";
                userDisplay.classList.remove('hidden');
                authBtn.classList.remove('hidden');
                editInfoBtn.classList.remove('hidden');
                
                if (isAdmin) {
                    adminNavBtn.classList.remove('hidden');
                } else {
                    adminNavBtn.classList.add('hidden');
                }

                switchView('bookstore');
                loadBooks(currentUser);
            } else {
                userDisplay.classList.add('hidden');
                authBtn.classList.add('hidden');
                adminNavBtn.classList.add('hidden');
                editInfoBtn.classList.add('hidden');
                switchView('login');
            }
        }

        async function performSignup() {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const passwordConfirm = document.getElementById('signup-password-confirm').value;

            if (!email || !password || !passwordConfirm) {
                alert("모든 항목을 입력해주세요.");
                return;
            }

            if (password !== passwordConfirm) {
                alert("비밀번호가 일치하지 않습니다. 다시 확인해주세요.");
                return;
            }

            const formData = new FormData();
            formData.append('email', email);
            formData.append('password', password);

            try {
                const res = await fetch(API_BASE + "/api/signup", { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok) {
                    alert(data.message);
                    switchView('login');
                } else {
                    alert(data.detail || "회원가입 실패");
                }
            } catch (err) {
                alert("서버 통신 실패");
            }
        }

        async function performLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                alert("이메일과 비밀번호를 모두 입력해주세요.");
                return;
            }

            const formData = new FormData();
            formData.append('email', email);
            formData.append('password', password);

            try {
                const res = await fetch(API_BASE + "/api/login", { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem("skybooks_logged_in_user", data.email);
                    localStorage.setItem("skybooks_is_admin", data.isAdmin);
                    alert("로그인 성공!");
                    checkLoginStatus();
                } else {
                    alert(data.detail || "로그인 실패");
                }
            } catch (err) {
                alert("서버 통신 실패");
            }
        }

        function handleLogout() {
            if (confirm("로그아웃 하시겠습니까?")) {
                localStorage.removeItem("skybooks_logged_in_user");
                localStorage.removeItem("skybooks_is_admin");
                checkLoginStatus();
            }
        }

        function openEditModal() {
            document.getElementById('edit-modal').classList.remove('hidden');
            document.getElementById('edit-modal').classList.add('flex');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            document.getElementById('edit-modal').classList.remove('flex');
        }

        async function updatePassword() {
            const currentUser = localStorage.getItem("skybooks_logged_in_user");
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;

            if (!currentPassword || !newPassword) {
                alert("현재 비밀번호와 새 비밀번호를 모두 입력해주세요.");
                return;
            }

            const formData = new FormData();
            formData.append('email', currentUser);
            formData.append('current_password', currentPassword);
            formData.append('new_password', newPassword);

            try {
                const res = await fetch(API_BASE + "/api/update-password", { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok) {
                    alert(data.message);
                    closeEditModal();
                    document.getElementById('current-password').value = "";
                    document.getElementById('new-password').value = "";
                } else {
                    alert(data.detail || "비밀번호 변경 실패");
                }
            } catch (err) {
                alert("서버 통신 실패");
            }
        }

        async function loadBooks(email) {
            try {
                const res = await fetch(API_BASE + "/api/books?email=" + encodeURIComponent(email));
                const data = await res.json();
                const grid = document.getElementById('book-grid');
                grid.innerHTML = "";

                if (data.books && data.books.length > 0) {
                    document.getElementById('book-count').innerText = "총 " + data.books.length + "권의 책이 있습니다.";
                    data.books.forEach(function(book) {
                        addBookCardToUI(book.title, book.author, book.image);
                    });
                } else {
                    document.getElementById('book-count').innerText = "등록된 책이 없습니다. 책을 추가해보세요!";
                }
            } catch (err) {
                document.getElementById('book-count').innerText = "서버 연결 확인 필요";
            }
        }

        async function openAdminModal() {
            const currentUser = localStorage.getItem("skybooks_logged_in_user");
            try {
                const res = await fetch(API_BASE + "/api/admin/all-data?email=" + encodeURIComponent(currentUser));
                const data = await res.json();
                if (res.ok) {
                    const listContainer = document.getElementById('admin-user-list');
                    listContainer.innerHTML = "";

                    data.users.forEach(user => {
                        let booksHtml = user.books.length > 0 
                            ? user.books.map(b => `<span class="bg-amber-50 text-amber-900 border border-amber-200 text-[11px] px-2 py-1 rounded-lg">${b.title} (${b.author})</span>`).join(' ')
                            : `<span class="text-stone-400 text-xs">등록된 책 없음</span>`;

                        const userDiv = document.createElement('div');
                        userDiv.className = "p-4 bg-stone-50 rounded-xl border border-stone-200 space-y-2";
                        userDiv.innerHTML = `
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-sm text-stone-900">👤 ${user.email}</span>
                                <span class="text-xs bg-stone-200 px-2 py-0.5 rounded-full text-stone-700">총 ${user.bookCount}권</span>
                            </div>
                            <div class="flex flex-wrap gap-1 mt-2">
                                ${booksHtml}
                            </div>
                        `;
                        listContainer.appendChild(userDiv);
                    });

                    document.getElementById('admin-modal').classList.remove('hidden');
                    document.getElementById('admin-modal').classList.add('flex');
                } else {
                    alert(data.detail || "권한이 없습니다.");
                }
            } catch (err) {
                alert("운영자 데이터 로딩 실패");
            }
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
            document.getElementById('admin-modal').classList.remove('flex');
        }

        function openUploadModal() {
            document.getElementById('upload-modal').classList.remove('hidden');
            document.getElementById('upload-modal').classList.add('flex');
        }

        function closeUploadModal() {
            document.getElementById('upload-modal').classList.add('hidden');
            document.getElementById('upload-modal').classList.remove('flex');
        }

        async function uploadBook(event) {
            event.preventDefault();
            const currentUser = localStorage.getItem("skybooks_logged_in_user");
            const title = document.getElementById('book-title').value;
            const author = document.getElementById('book-author').value;
            const imageFile = document.getElementById('book-image').files[0];

            const formData = new FormData();
            formData.append('email', currentUser);
            formData.append('title', title);
            formData.append('author', author);
            formData.append('file', imageFile);

            try {
                const response = await fetch(API_BASE + "/api/upload-page", {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    alert(result.message);
                    closeUploadModal();
                    addBookCardToUI(title, author, result.book.image);
                    document.getElementById('upload-form').reset();
                    loadBooks(currentUser);
                } else {
                    alert("업로드 중 문제가 발생했습니다.");
                }
            } catch (error) {
                alert("서버와 통신하지 못했습니다.");
            }
        }

<!-- 책 읽기 및 페이지 추가 모달 -->
<div id="reader-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl max-h-[90vh] flex flex-col">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <div>
                <h3 id="reader-title" class="text-lg font-bold text-stone-900">책 제목</h3>
                <p id="reader-author" class="text-xs text-stone-500">저자</p>
            </div>
            <button onclick="closeReaderModal()" class="text-stone-400 hover:text-stone-700 text-sm font-bold">✕</button>
        </div>

        <!-- 페이지가 보여지는 영역 -->
        <div class="flex-1 overflow-y-auto space-y-4 pr-2 bg-stone-50 p-3 rounded-xl border border-stone-200 min-h-[300px] flex flex-col items-center justify-center" id="reader-pages-container">
            <!-- 동적 페이지 이미지 목록 -->
        </div>

        <!-- 페이지 추가 폼 -->
        <form id="add-page-form" onsubmit="addBookPage(event)" class="mt-4 pt-3 border-t flex gap-2 items-center">
            <input type="file" id="page-image" accept="image/*" required class="w-full border border-stone-300 rounded-xl px-3 py-1.5 text-xs text-stone-500 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-100 file:text-amber-800 hover:file:bg-amber-200">
            <button type="submit" class="whitespace-nowrap px-4 py-2 text-xs bg-amber-800 text-white font-semibold rounded-xl hover:bg-amber-900 transition">페이지 추가</button>
        </form>
    </div>
</div>

        function addBookCardToUI(title, author, imagePath) {
            const grid = document.getElementById('book-grid');
            const card = document.createElement('div');
            card.className = "bg-white p-3 rounded-2xl shadow-sm border border-stone-200 flex flex-col justify-between hover:shadow-md transition";
            
            let imageHtml = imagePath 
                ? `<img src="${imagePath}" alt="${title}" class="w-full h-full object-cover rounded-xl">`
                : `<span class="text-stone-600 font-semibold text-sm">${title}</span>`;

            card.innerHTML = `
                <div>
                    <div class="bg-stone-100 aspect-[3/4] rounded-xl flex items-center justify-center text-stone-400 text-xs mb-3 overflow-hidden">
                        ${imageHtml}
                    </div>
                    <div>
                        <h3 class="font-bold text-stone-800 text-sm truncate">${title}</h3>
                        <p class="text-xs text-stone-500 truncate mt-0.5">${author}</p>
                    </div>
                </div>
                <div class="mt-3 pt-2 border-t border-stone-100 flex items-center justify-between">
                    <span class="text-[10px] text-amber-800 font-medium">등록됨</span>
                    <button class="delete-btn text-xs bg-rose-50 text-rose-600 border border-rose-200 px-2 py-1 rounded-lg hover:bg-rose-100 transition">삭제</button>
                </div>
            `;

            // 삭제 버튼에 이벤트 연결
            const deleteBtn = card.querySelector('.delete-btn');
            deleteBtn.onclick = async () => {
                if (confirm(`'${title}' 책을 정말 삭제하시겠습니까?`)) {
                    const currentUser = localStorage.getItem("skybooks_logged_in_user");
                    const formData = new URLSearchParams();
                    formData.append('email', currentUser);
                    formData.append('title', title);

                    try {
                        const res = await fetch(API_BASE + "/api/books", {
                            method: 'DELETE',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: formData
                        });

                        if (res.ok) {
                            alert("삭제되었습니다.");
                            loadBooks(currentUser); // 목록 새로고침
                        } else {
                            const errData = await res.json();
                            alert(errData.detail || "삭제 실패");
                        }
                    } catch (err) {
                        alert("서버 통신 실패");
                    }
                }
            };

            grid.prepend(card);
        }

let currentReadingBookTitle = "";

// 책 카드 클릭하거나 '읽기' 버튼을 눌렀을 때 실행될 함수
function openReaderModal(title, author, pages) {
    currentReadingBookTitle = title;
    document.getElementById('reader-title').innerText = title;
    document.getElementById('reader-author').innerText = author;

    renderReaderPages(pages);

    document.getElementById('reader-modal').classList.remove('hidden');
    document.getElementById('reader-modal').classList.add('flex');
}

function closeReaderModal() {
    document.getElementById('reader-modal').classList.add('hidden');
    document.getElementById('reader-modal').classList.remove('flex');
    currentReadingBookTitle = "";
}

// 페이지 이미지들을 화면에 그려주는 함수
function renderReaderPages(pages) {
    const container = document.getElementById('reader-pages-container');
    container.innerHTML = "";

    if (!pages || pages.length === 0) {
        container.innerHTML = `<p class="text-xs text-stone-400">등록된 페이지가 없습니다.</p>`;
        return;
    }

    pages.forEach((pageUrl, index) => {
        const pageDiv = document.createElement('div');
        pageDiv.className = "w-full flex flex-col items-center bg-white p-2 rounded-lg border shadow-sm";
        pageDiv.innerHTML = `
            <span class="text-[10px] text-stone-400 mb-1">${index + 1} 페이지</span>
            <img src="${pageUrl}" class="max-h-[400px] object-contain rounded-lg">
        `;
        container.appendChild(pageDiv);
    });
}

// 서버로 새로운 페이지 사진을 전송하는 함수
async function addBookPage(event) {
    event.preventDefault();
    const currentUser = localStorage.getItem("skybooks_logged_in_user");
    const imageFile = document.getElementById('page-image').files[0];

    if (!imageFile || !currentReadingBookTitle) return;

    const formData = new FormData();
    formData.append('email', currentUser);
    formData.append('title', currentReadingBookTitle);
    formData.append('file', imageFile);

    try {
        const res = await fetch(API_BASE + "/api/add-page", {
            method: 'POST',
            body: formData
        });

        if (res.ok) {
            const data = await res.json();
            alert(data.message);
            document.getElementById('add-page-form').reset();

            // 현재 열려있는 책의 페이지 목록을 최신화해서 다시 렌더링
            // (서버에서 최신 책 정보를 다시 불러와 갱신)
            refreshCurrentBookPages(currentUser, currentReadingBookTitle);
        } else {
            const errData = await res.json();
            alert(errData.detail || "페이지 추가 실패");
        }
    } catch (err) {
        alert("서버 통신 실패");
    }
}

// 페이지 추가 후 최신 데이터로 모달 내부 갱신하는 헬퍼 함수
async function refreshCurrentBookPages(email, title) {
    try {
        const res = await fetch(API_BASE + "/api/books?email=" + encodeURIComponent(email));
        const data = await res.json();
        if (data.books) {
            const book = data.books.find(b => b.title === title);
            if (book) {
                renderReaderPages(book.pages);
            }
        }
    } catch (e) {
        console.error(e);
    }
}
        
    </script>
