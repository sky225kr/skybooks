<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sky북스 - 내 서재</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/50 text-stone-800 min-h-screen flex flex-col justify-between">

    <!-- 상단 네비게이션바 -->
    <header class="w-full bg-white border-b border-stone-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-4xl mx-auto p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-amber-900 flex items-center gap-2">
                📚 sky북스 <span class="text-xs font-normal bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">내 서재</span>
            </h1>
            <div class="flex items-center gap-4">
                <span class="text-xs text-stone-500 hidden sm:inline">yooneeeo@gmail.com 님</span>
                <button class="text-xs font-medium text-stone-600 hover:text-stone-900 border border-stone-300 px-3 py-1.5 rounded-lg transition">로그아웃</button>
            </div>
        </div>
    </header>

    <!-- 메인 책꽂이 컨테이너 -->
    <main class="w-full max-w-4xl mx-auto px-6 py-8 flex-1">
        
        <!-- 상단 액션 바 -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-bold text-stone-900">나의 책꽂이</h2>
                <p class="text-xs text-stone-500 mt-0.5">총 3권의 책이 꽂혀있습니다.</p>
            </div>
            <button class="flex items-center gap-2 px-4 py-2 bg-amber-800 text-white text-sm font-semibold rounded-xl shadow hover:bg-amber-900 transition">
                <span>+ 새 책 추가하기</span>
            </button>
        </div>

        <!-- 책 그리드 목록 -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            
            <!-- 책 카드 1 -->
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-stone-200 flex flex-col justify-between hover:shadow-md transition cursor-pointer group">
                <div class="bg-stone-100 aspect-[3/4] rounded-xl flex items-center justify-center text-stone-400 text-xs mb-3 group-hover:bg-amber-50 transition overflow-hidden">
                    <!-- 실제 업로드된 표지 이미지가 들어갈 자리 -->
                    <span class="text-center px-2">표지 미리보기</span>
                </div>
                <div>
                    <h3 class="font-bold text-stone-800 text-sm truncate">어린왕자</h3>
                    <p class="text-xs text-stone-500 truncate mt-0.5">생텍쥐페리</p>
                    <div class="mt-2 flex items-center justify-between text-[10px] text-stone-400 border-t border-stone-100 pt-2">
                        <span>페이지 24쪽</span>
                        <span class="text-amber-800 font-medium">읽는 중</span>
                    </div>
                </div>
            </div>

            <!-- 책 카드 2 -->
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-stone-200 flex flex-col justify-between hover:shadow-md transition cursor-pointer group">
                <div class="bg-stone-100 aspect-[3/4] rounded-xl flex items-center justify-center text-stone-400 text-xs mb-3 group-hover:bg-amber-50 transition overflow-hidden">
                    <span class="text-center px-2">표지 미리보기</span>
                </div>
                <div>
                    <h3 class="font-bold text-stone-800 text-sm truncate">데미안</h3>
                    <p class="text-xs text-stone-500 truncate mt-0.5">헤르만 헤세</p>
                    <div class="mt-2 flex items-center justify-between text-[10px] text-stone-400 border-t border-stone-100 pt-2">
                        <span>페이지 120쪽</span>
                        <span class="text-stone-500">완독</span>
                    </div>
                </div>
            </div>

            <!-- 책 카드 3 -->
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-stone-200 flex flex-col justify-between hover:shadow-md transition cursor-pointer group">
                <div class="bg-stone-100 aspect-[3/4] rounded-xl flex items-center justify-center text-stone-400 text-xs mb-3 group-hover:bg-amber-50 transition overflow-hidden">
                    <span class="text-center px-2">표지 미리보기</span>
                </div>
                <div>
                    <h3 class="font-bold text-stone-800 text-sm truncate">파이썬 알고리즘</h3>
                    <p class="text-xs text-stone-500 truncate mt-0.5">박스팡</p>
                    <div class="mt-2 flex items-center justify-between text-[10px] text-stone-400 border-t border-stone-100 pt-2">
                        <span>페이지 15쪽</span>
                        <span class="text-amber-800 font-medium">읽는 중</span>
                    </div>
                </div>
            </div>

            <!-- 새 책 추가 빈 카드 (바로가기용) -->
            <div class="border-2 border-dashed border-stone-300 rounded-2xl flex flex-col items-center justify-center p-4 text-stone-400 hover:border-amber-800 hover:text-amber-800 transition cursor-pointer aspect-[3/4]">
                <span class="text-3xl mb-1">+</span>
                <span class="text-xs font-medium">책 추가하기</span>
            </div>

        </div>

    </main>

    <!-- 하단 푸터 -->
    <footer class="w-full max-w-4xl mx-auto p-6 text-center text-xs text-stone-400 border-t border-stone-200 mt-12 space-y-1">
        <p>&copy; sky북스. All rights reserved. by sungkook.yoon</p>
        <p>
            Contact: <a href="&#109;&#97;&#105;&#108;&#116;&#111;&#58;&#121;&#111;&#111;&#110;&#101;&#101;&#111;&#64;&#103;&#109;&#97;&#105;&#108;&#46;&#99;&#111;&#109;" class="no-underline hover:text-stone-600 transition">&#121;&#111;&#111;&#110;&#101;&#101;&#111;&#64;&#103;&#109;&#97;&#105;&#108;&#46;&#99;&#111;&#109;</a>
        </p>
    </footer>

</body>
</html>
